      <main>
        <section class="contact-form">
          <h1>Neem contact op</h1>
          <form>
            <label for="email">*E-mailadres:</label>
            <input 
            type="email" 
            id="email" 
            name="email" 
            required
            placeholder="Ronald.McDonald@healty-haarlem.nl" />
            <span class="error-message">Dit email address is ongeldig</span>


            <label for="message">*Bericht:</label>
            <textarea id="message" name="message" rows="6" required placeholder="Bericht"></textarea>

          <button type="submit">Verzenden</button>
          </form>
        </section>
        <section>
          <p class="w3c">
            <a href="https://jigsaw.w3.org/css-validator/check/referer">

                alt="Valid CSS!" />
